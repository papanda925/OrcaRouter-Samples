name: Validate samples

on:
  pull_request:
  push:
    branches:
      - main
      - "feature/**"
      - "fix/**"

permissions:
  contents: read

jobs:
  web:
    name: Web syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: |
          node --check Web/app.js
          node --check Web/ui-contract.test.js

      - name: Verify Web UI behavior contract
        run: node Web/ui-contract.test.js

  powershell:
    name: PowerShell and XAML
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse PowerShell and load XAML
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          foreach ($scriptPath in @(
            'PowerShell/OrcaRouterChat.ps1',
            'PowerShell/OrcaRouterWorker.ps1'
          )) {
            $tokens = $null
            $errors = $null
            $scriptText = Get-Content $scriptPath -Raw -Encoding UTF8

            [System.Management.Automation.Language.Parser]::ParseInput(
              $scriptText,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null

            if ($errors.Count -gt 0) {
              $errors | ForEach-Object {
                Write-Error ("{0} Line {1}: {2}" -f $scriptPath, $_.Extent.StartLineNumber, $_.Message)
              }
              exit 1
            }
          }

          Add-Type -AssemblyName PresentationFramework
          [xml]$xaml = Get-Content 'PowerShell/MainWindow.xaml' -Raw -Encoding UTF8
          $reader = New-Object System.Xml.XmlNodeReader $xaml
          $window = [Windows.Markup.XamlReader]::Load($reader)

          if ($null -eq $window.FindName('ModeBox')) {
            throw 'ModeBox was not found in MainWindow.xaml'
          }

          $resultTabs = $window.FindName('ResultTabs')

          if ($null -eq $resultTabs) {
            throw 'ResultTabs was not found in MainWindow.xaml'
          }

          if ($resultTabs.Items.Count -ne 3) {
            throw 'ResultTabs must contain Answer, Developer, and Trace tabs.'
          }

          if ($null -eq $window.FindName('DeveloperBox')) {
            throw 'DeveloperBox was not found in MainWindow.xaml'
          }

          if ($null -eq $window.FindName('NewChatButton')) {
            throw 'NewChatButton was not found in MainWindow.xaml'
          }

          if ($null -eq $window.FindName('PromptExampleBox')) {
            throw 'PromptExampleBox was not found in MainWindow.xaml'
          }

          if ($null -eq $window.FindName('ApplyPromptExampleButton')) {
            throw 'ApplyPromptExampleButton was not found in MainWindow.xaml'
          }

          $pageScrollViewer = $window.FindName('PageScrollViewer')

          if ($null -eq $pageScrollViewer) {
            throw 'PageScrollViewer was not found in MainWindow.xaml'
          }

          if (
            $pageScrollViewer.VerticalScrollBarVisibility -ne
            [System.Windows.Controls.ScrollBarVisibility]::Auto
          ) {
            throw 'PageScrollViewer must use an automatic vertical scrollbar.'
          }

      - name: Execute script parser through Windows PowerShell 5.1
        shell: powershell
        run: |
          & powershell.exe -NoProfile -STA -ExecutionPolicy Bypass -File '.\PowerShell\OrcaRouterChat.ps1' -SyntaxCheck

          if ($LASTEXITCODE -ne 0) {
            throw "Windows PowerShell 5.1 failed to decode/parse OrcaRouterChat.ps1."
          }

      - name: Verify WPF Data Binding and responsive layout
        shell: powershell
        run: |
          & powershell.exe -NoProfile -STA -ExecutionPolicy Bypass -File '.\PowerShell\OrcaRouterChat.ps1' -UiBindingCheck

          if ($LASTEXITCODE -ne 0) {
            throw "WPF Data Binding / layout check failed."
          }

      - name: Verify background runspace event pipeline
        shell: powershell
        run: |
          $queue = [System.Collections.Concurrent.ConcurrentQueue[object]]::new()
          $worker = [System.Management.Automation.PowerShell]::Create()

          [void]$worker.AddCommand((Resolve-Path '.\PowerShell\OrcaRouterWorker.ps1').Path)
          [void]$worker.AddParameter('SelfTest', $true)
          [void]$worker.AddParameter('EventQueue', $queue)

          $async = $worker.BeginInvoke()

          if (-not $async.AsyncWaitHandle.WaitOne(5000)) {
            $worker.Stop()
            $worker.Dispose()
            throw 'Background runspace self-test timed out.'
          }

          [void]$worker.EndInvoke($async)
          $worker.Dispose()

          $events = @()
          $item = $null

          while ($queue.TryDequeue([ref]$item)) {
            $events += $item
            $item = $null
          }

          if (-not ($events | Where-Object Type -eq 'Answer')) {
            throw 'Background runspace did not emit an Answer event.'
          }

          if (-not ($events | Where-Object Type -eq 'Completed')) {
            throw 'Background runspace did not emit a Completed event.'
          }

          # Full Chat pipeline regression test:
          # exercise STEP 1 -> STEP 6 with a mock HTTP response so Windows
          # PowerShell 5.1 executes the same post-response path as a real request.
          foreach ($historyCase in @(
              @(),
              @([pscustomobject]@{ User = 'previous question'; Assistant = 'previous answer' })
          )) {
              $queue = [System.Collections.Concurrent.ConcurrentQueue[object]]::new()
              $worker = [System.Management.Automation.PowerShell]::Create()

              [void]$worker.AddCommand((Resolve-Path '.\PowerShell\OrcaRouterWorker.ps1').Path)
              [void]$worker.AddParameter('PipelineSelfTest', $true)
              [void]$worker.AddParameter('ApiKey', 'test-key')
              [void]$worker.AddParameter('Model', 'orcarouter/free')
              [void]$worker.AddParameter('Question', 'pipeline test')
              [void]$worker.AddParameter('Mode', 'Chat')
              [void]$worker.AddParameter('History', [object[]]$historyCase)
              [void]$worker.AddParameter('EventQueue', $queue)

              $async = $worker.BeginInvoke()

              if (-not $async.AsyncWaitHandle.WaitOne(5000)) {
                  $worker.Stop()
                  $worker.Dispose()
                  throw 'Full Chat pipeline self-test timed out.'
              }

              [void]$worker.EndInvoke($async)
              $worker.Dispose()

              $events = @()
              $item = $null

              while ($queue.TryDequeue([ref]$item)) {
                  $events += $item
                  $item = $null
              }

              $errors = @($events | Where-Object Type -eq 'Error')
              if ($errors.Length -gt 0) {
                  $first = $errors[0]
                  throw "Full Chat pipeline emitted Error: $($first.Message) line=$($first.ScriptLineNumber) $($first.PositionMessage)"
              }

              $completed = @($events | Where-Object Type -eq 'Completed')
              if ($completed.Length -ne 1) {
                  throw 'Full Chat pipeline must emit exactly one Completed event.'
              }

              if ([string]$completed[0].Answer -ne 'mock pipeline answer') {
                  throw "Unexpected mock Chat answer: $($completed[0].Answer)"
              }

              $step6 = @(
                  $events |
                  Where-Object {
                      $_.Type -eq 'Trace' -and $_.Step -eq 'STEP 6'
                  }
              )

              if ($step6.Length -ne 1) {
                  throw 'Full Chat pipeline did not reach STEP 6.'
              }
          }

  safety:
    name: Source safety checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure real-looking OrcaRouter keys are not in source
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -n -E 'sk-orca-[A-Za-z0-9_-]+' Web PowerShell VBA; then
            echo "A real-looking OrcaRouter API key was found in source files."
            exit 1
          fi

          grep -q 'xxx-your-orcarouter-api-key-xxx' Web/app.js
          grep -q 'xxx-your-orcarouter-api-key-xxx' PowerShell/OrcaRouterChat.ps1
          grep -q 'xxx-your-orcarouter-api-key-xxx' VBA/OrcaRouterSample.bas

      - name: Ensure PowerShell sample contains no embedded CSharp ViewModel
        shell: bash
        run: |
          set -euo pipefail

          if grep -n -E 'Add-Type[[:space:]]+-TypeDefinition|using[[:space:]]+System\.ComponentModel|public[[:space:]]+sealed[[:space:]]+class' PowerShell/*.ps1; then
            echo "PowerShell sample must not compile embedded C# source."
            exit 1
          fi

          grep -q 'System.Data.DataTable' PowerShell/OrcaRouterChat.ps1
          grep -q 'INotifyPropertyChanged' PowerShell/OrcaRouterChat.ps1
          grep -q 'BeginInvoke' PowerShell/OrcaRouterChat.ps1

      - name: Check for accidental secrets and personal paths
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import subprocess
          import sys

          tracked = subprocess.check_output(
              ["git", "ls-files"],
              text=True,
              encoding="utf-8",
          ).splitlines()

          real_key_re = re.compile(r"sk-orca-[A-Za-z0-9_-]{24,}")
          windows_user_re = re.compile(
              r"[A-Za-z]:\\Users\\([^\\/\r\n<>]+)",
              re.I,
          )
          unix_home_re = re.compile(r"/home/([^/\s<>]+)")
          email_re = re.compile(
              r"\b[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}\b",
              re.I,
          )

          allowed_dummy_users = {
              "user",
              "username",
              "example-user",
              "actual-user-name",
          }

          failed = False

          for file_name in tracked:
              path = Path(file_name)

              # Do not scan this workflow source itself: it necessarily contains
              # the regex patterns and example placeholders used by the audit.
              if file_name == ".github/workflows/validate-samples.yml":
                  continue

              if not path.is_file():
                  continue

              try:
                  text = path.read_text(encoding="utf-8")
              except UnicodeDecodeError:
                  continue

              for match in real_key_re.finditer(text):
                  print(
                      f"{path}: real-looking OrcaRouter API key found "
                      f"near offset {match.start()}"
                  )
                  failed = True

              for match in windows_user_re.finditer(text):
                  user_name = match.group(1).lower()
                  if user_name not in allowed_dummy_users:
                      print(
                          f"{path}: concrete Windows user path found: "
                          f"C:\\Users\\{match.group(1)}\\..."
                      )
                      failed = True

              for match in unix_home_re.finditer(text):
                  user_name = match.group(1).lower()
                  if user_name not in allowed_dummy_users:
                      print(
                          f"{path}: concrete Unix home path found: "
                          f"/home/{match.group(1)}/..."
                      )
                      failed = True

              for match in email_re.finditer(text):
                  address = match.group(0).lower()
                  if not address.endswith("@example.com"):
                      print(f"{path}: email address found: {match.group(0)}")
                      failed = True

          if failed:
              print(
                  "Replace secrets/personal values with placeholders such as "
                  "<API_KEY>, <USER>, <repository-root>, or example@example.com."
              )
              sys.exit(1)

          print("Secret/personal-path audit passed.")
          PY

      - name: Check cross-sample UI behavior contract
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import sys

          failures = []

          def require(condition, message):
              if not condition:
                  failures.append(message)

          web = Path("Web/app.js").read_text(encoding="utf-8")
          web_html = Path("Web/index.html").read_text(encoding="utf-8")
          ps = Path("PowerShell/OrcaRouterChat.ps1").read_text(encoding="utf-8-sig")
          vba = Path("VBA/OrcaRouterSample.bas").read_text(encoding="ascii")
          vba_adv = Path("VBA/OrcaRouterAdvanced.bas").read_text(encoding="ascii")

          require(
              Path("docs/ui-behavior-contract.md").is_file(),
              "Shared UI behavior contract document is missing.",
          )

          require(
              'id="applyPromptExampleButton"' in web_html,
              "Web explicit prompt apply control is missing.",
          )
          require(
              "renderConversation(question, errorText);" in web,
              "Web error result must keep question/error visible.",
          )
          require(
              "resetDeveloperInfo();" in web,
              "Web must reset Developer Information for each request attempt.",
          )
          require(
              'renderConversation(question, "");' not in web,
              "Web must not flash pending question before a response.",
          )

          require(
              "function Show-RequestError" in ps,
              "PowerShell shared error renderer function is missing.",
          )

          mode_start = ps.find("$modeBox.Add_SelectionChanged({")
          mode_end = ps.find("$questionBox.Add_TextChanged({", mode_start)
          require(mode_start >= 0 and mode_end > mode_start, "PowerShell Mode handler not found.")
          if mode_start >= 0 and mode_end > mode_start:
              require(
                  "$questionBox.Text =" not in ps[mode_start:mode_end],
                  "PowerShell Mode change must not overwrite Question.",
              )

          invoke_start = ps.find("function Invoke-OrcaRouterChat")
          invoke_end = ps.find("$script:workerPollTimer.Add_Tick", invoke_start)
          require(invoke_start >= 0 and invoke_end > invoke_start, "PowerShell send function not found.")
          if invoke_start >= 0 and invoke_end > invoke_start:
              invoke = ps[invoke_start:invoke_end]
              require(
                  "Get-ConversationTranscript -PendingQuestion $question" not in invoke,
                  "PowerShell must not flash pending Question before response.",
              )
              require(
                  "Show-RequestError" in invoke,
                  "PowerShell input errors must use the shared visible error renderer.",
              )
              require(
                  "Set-DeveloperPendingInformation -Model $model" in invoke,
                  "PowerShell must reset Developer Information for the current request.",
              )

          require(
              'Prompt template (optional)' in vba
              and '.TextFrame2.TextRange.Text = "Insert prompt"' in vba,
              "VBA prompt template workflow is not explicit enough.",
          )
          require(
              'GetOrcaRouterConversationDisplay(question)' not in vba,
              "VBA Chat must not flash pending Question before response.",
          )
          require(
              'GetOrcaRouterConversationDisplay( _' in vba
              and '"ERROR: " & errorDescription' in vba,
              "VBA Chat error must keep submitted Question/error visible.",
          )
          require(
              "ResetOrcaRouterDeveloperInformation ws" in vba,
              "VBA must reset Developer Information for each request attempt.",
          )
          require(
              vba_adv.count("BuildOrcaRouterConversationMessageItemsJson(question)") >= 3,
              "VBA Streaming/Tool Calling must reuse shared conversation history.",
          )
          require(
              vba_adv.count("CommitOrcaRouterConversationTurn") >= 2,
              "VBA advanced modes must commit successful turns.",
          )
          require(
              vba_adv.count("UpdateOrcaRouterDeveloperInformation") >= 4,
              "VBA advanced modes must update Developer Information on success/error.",
          )

          if failures:
              for failure in failures:
                  print(f"UI contract failure: {failure}")
              sys.exit(1)

          print("Cross-sample UI behavior contract checks passed.")
          PY

      - name: Check priority-one playground features
        shell: bash
        run: |
          set -euo pipefail

          referral='https://www.orcarouter.ai/ref/ref_5074f764e512c8dd3d9d'

          grep -q "$referral" README.md
          grep -q "$referral" Web/index.html
          grep -q "$referral" PowerShell/OrcaRouterChat.ps1
          grep -q "$referral" VBA/OrcaRouterSample.bas

          grep -q 'MAX_HISTORY_TURNS = 10' Web/app.js
          grep -q 'X-OrcaRouter-Include-Cost' Web/app.js
          grep -q 'newChatButton' Web/app.js
          grep -q 'Developer Information' Web/index.html

          grep -q 'MaxHistoryTurns = 10' PowerShell/OrcaRouterChat.ps1
          grep -q 'X-OrcaRouter-Include-Cost' PowerShell/OrcaRouterWorker.ps1
          grep -q '\[object\[\]\]\$History' PowerShell/OrcaRouterWorker.ps1

          grep -q 'MAX_HISTORY_TURNS As Long = 10' VBA/OrcaRouterSample.bas
          grep -q 'X-OrcaRouter-Include-Cost' VBA/OrcaRouterSample.bas
          grep -q 'Public Sub NewOrcaRouterChat' VBA/OrcaRouterSample.bas
          grep -q 'Developer Information' VBA/OrcaRouterSample.bas

      - name: Check VBA advanced entry points exist
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'Public Sub SendOrcaRouterStreaming' VBA/OrcaRouterAdvanced.bas
          grep -q 'Public Sub SendOrcaRouterToolCalling' VBA/OrcaRouterAdvanced.bas
          grep -q 'RaiseOrcaRouterHttpError' VBA/OrcaRouterAdvanced.bas

      - name: Ensure VBA source is ASCII-only
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import sys

          failed = False

          for path in Path("VBA").glob("*.bas"):
              data = path.read_bytes()
              try:
                  data.decode("ascii")
              except UnicodeDecodeError as exc:
                  print(f"{path}: non-ASCII byte at offset {exc.start}")
                  failed = True

          if failed:
              sys.exit(1)
          PY

      - name: Check VBA line continuation limit
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import sys

          failed = False

          for path in Path("VBA").glob("*.bas"):
              run = 0
              run_start = 0

              for line_number, line in enumerate(
                  path.read_text(encoding="utf-8").splitlines(),
                  start=1,
              ):
                  if re.search(r"_\s*$", line):
                      if run == 0:
                          run_start = line_number
                      run += 1
                  else:
                      if run > 24:
                          print(
                              f"{path}:{run_start}: "
                              f"{run} line-continuation characters in one statement "
                              "(VBA maximum is 24)."
                          )
                          failed = True
                      run = 0

              if run > 24:
                  print(
                      f"{path}:{run_start}: "
                      f"{run} line-continuation characters in one statement "
                      "(VBA maximum is 24)."
                  )
                  failed = True

          if failed:
              sys.exit(1)
          PY

      - name: Static audit VBA declarations and compile-risk patterns
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import sys

          failed = False
          procedures = {}
          modules = {}

          proc_re = re.compile(
              r"^\s*(?:Public|Private)?\s*(Sub|Function)\s+([A-Za-z_][A-Za-z0-9_]*)",
              re.I,
          )
          dim_re = re.compile(r"^\s*Dim\s+(.+)", re.I)

          for path in Path("VBA").glob("*.bas"):
              text = path.read_text(encoding="ascii")
              lines = text.splitlines()
              modules[path] = lines

              if not any(re.match(r"^\s*Option\s+Explicit\s*$", line, re.I) for line in lines):
                  print(f"{path}: Option Explicit is missing")
                  failed = True

              for line_number, line in enumerate(lines, start=1):
                  if len(line) > 1023:
                      print(
                          f"{path}:{line_number}: physical line length "
                          f"{len(line)} exceeds VBA's 1023-character limit"
                      )
                      failed = True

                  match = proc_re.match(line)
                  if match:
                      name = match.group(2).lower()
                      procedures.setdefault(name, []).append(
                          (path, line_number, match.group(1).lower())
                      )

              if "DUMMY_API_KEY" in text:
                  print(f"{path}: legacy undefined identifier DUMMY_API_KEY found")
                  failed = True

          for name, locations in procedures.items():
              if len(locations) > 1:
                  locations_text = ", ".join(
                      f"{path}:{line}" for path, line, _ in locations
                  )
                  print(
                      f"Duplicate procedure name '{name}' across VBA modules: "
                      f"{locations_text}"
                  )
                  failed = True

          proc_names = set(procedures)

          for path, lines in modules.items():
              current = None
              current_kind = None

              for line_number, line in enumerate(lines, start=1):
                  match = proc_re.match(line)
                  if match:
                      current = match.group(2)
                      current_kind = match.group(1).lower()
                      continue

                  if current:
                      dim_match = dim_re.match(line)
                      if dim_match:
                          for part in dim_match.group(1).split(","):
                              local_match = re.match(
                                  r"\s*([A-Za-z_][A-Za-z0-9_]*)",
                                  part,
                              )
                              if local_match:
                                  local_name = local_match.group(1).lower()
                                  if local_name in proc_names:
                                      print(
                                          f"{path}:{line_number}: local variable "
                                          f"'{local_name}' shadows a procedure/function name "
                                          f"inside {current}"
                                      )
                                      failed = True

                      if re.match(
                          rf"^\s*End\s+{re.escape(current_kind)}\s*$",
                          line,
                          re.I,
                      ):
                          current = None
                          current_kind = None

          if failed:
              sys.exit(1)

          print("VBA static audit passed.")
          PY
