name: Validate samples

on:
  pull_request:
  push:
    branches:
      - main
      - "feature/**"
      - "fix/**"

permissions:
  contents: read

jobs:
  web:
    name: Web syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: node --check Web/app.js

  powershell:
    name: PowerShell and XAML
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse PowerShell and load XAML
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          $scriptText = Get-Content 'PowerShell/OrcaRouterChat.ps1' -Raw -Encoding UTF8
          [System.Management.Automation.Language.Parser]::ParseInput(
            $scriptText,
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null

          if ($errors.Count -gt 0) {
            $errors | ForEach-Object {
              Write-Error ("Line {0}: {1}" -f $_.Extent.StartLineNumber, $_.Message)
            }
            exit 1
          }

          Add-Type -AssemblyName PresentationFramework
          [xml]$xaml = Get-Content 'PowerShell/MainWindow.xaml' -Raw -Encoding UTF8
          $reader = New-Object System.Xml.XmlNodeReader $xaml
          $window = [Windows.Markup.XamlReader]::Load($reader)

          if ($null -eq $window.FindName('ModeBox')) {
            throw 'ModeBox was not found in MainWindow.xaml'
          }

      - name: Execute script parser through Windows PowerShell 5.1
        shell: powershell
        run: |
          & powershell.exe -NoProfile -STA -ExecutionPolicy Bypass -File '.\PowerShell\OrcaRouterChat.ps1' -SyntaxCheck

          if ($LASTEXITCODE -ne 0) {
            throw "Windows PowerShell 5.1 failed to decode/parse OrcaRouterChat.ps1."
          }

      - name: Verify WPF QuestionBox editor
        shell: powershell
        run: |
          & powershell.exe -NoProfile -STA -ExecutionPolicy Bypass -File '.\PowerShell\OrcaRouterChat.ps1' -UiBindingCheck

          if ($LASTEXITCODE -ne 0) {
            throw "WPF QuestionBox editor check failed."
          }

  safety:
    name: Source safety checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure real-looking OrcaRouter keys are not in source
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -n -E 'sk-orca-[A-Za-z0-9_-]+' Web PowerShell VBA; then
            echo "A real-looking OrcaRouter API key was found in source files."
            exit 1
          fi

          grep -q 'xxx-your-orcarouter-api-key-xxx' Web/app.js
          grep -q 'xxx-your-orcarouter-api-key-xxx' PowerShell/OrcaRouterChat.ps1
          grep -q 'xxx-your-orcarouter-api-key-xxx' VBA/OrcaRouterSample.bas

      - name: Check for accidental secrets and personal paths
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import subprocess
          import sys

          tracked = subprocess.check_output(
              ["git", "ls-files"],
              text=True,
              encoding="utf-8",
          ).splitlines()

          real_key_re = re.compile(r"sk-orca-[A-Za-z0-9_-]{24,}")
          windows_user_re = re.compile(
              r"[A-Za-z]:\\Users\\([^\\/\r\n<>]+)",
              re.I,
          )
          unix_home_re = re.compile(r"/home/([^/\s<>]+)")
          email_re = re.compile(
              r"\b[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}\b",
              re.I,
          )

          allowed_dummy_users = {
              "user",
              "username",
              "example-user",
              "actual-user-name",
          }

          failed = False

          for file_name in tracked:
              path = Path(file_name)

              # Do not scan this workflow source itself: it necessarily contains
              # the regex patterns and example placeholders used by the audit.
              if file_name == ".github/workflows/validate-samples.yml":
                  continue

              if not path.is_file():
                  continue

              try:
                  text = path.read_text(encoding="utf-8")
              except UnicodeDecodeError:
                  continue

              for match in real_key_re.finditer(text):
                  print(
                      f"{path}: real-looking OrcaRouter API key found "
                      f"near offset {match.start()}"
                  )
                  failed = True

              for match in windows_user_re.finditer(text):
                  user_name = match.group(1).lower()
                  if user_name not in allowed_dummy_users:
                      print(
                          f"{path}: concrete Windows user path found: "
                          f"C:\\Users\\{match.group(1)}\\..."
                      )
                      failed = True

              for match in unix_home_re.finditer(text):
                  user_name = match.group(1).lower()
                  if user_name not in allowed_dummy_users:
                      print(
                          f"{path}: concrete Unix home path found: "
                          f"/home/{match.group(1)}/..."
                      )
                      failed = True

              for match in email_re.finditer(text):
                  address = match.group(0).lower()
                  if not address.endswith("@example.com"):
                      print(f"{path}: email address found: {match.group(0)}")
                      failed = True

          if failed:
              print(
                  "Replace secrets/personal values with placeholders such as "
                  "<API_KEY>, <USER>, <repository-root>, or example@example.com."
              )
              sys.exit(1)

          print("Secret/personal-path audit passed.")
          PY

      - name: Check VBA advanced entry points exist
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'Public Sub SendOrcaRouterStreaming' VBA/OrcaRouterAdvanced.bas
          grep -q 'Public Sub SendOrcaRouterToolCalling' VBA/OrcaRouterAdvanced.bas
          grep -q 'RaiseOrcaRouterHttpError' VBA/OrcaRouterAdvanced.bas

      - name: Ensure VBA source is ASCII-only
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import sys

          failed = False

          for path in Path("VBA").glob("*.bas"):
              data = path.read_bytes()
              try:
                  data.decode("ascii")
              except UnicodeDecodeError as exc:
                  print(f"{path}: non-ASCII byte at offset {exc.start}")
                  failed = True

          if failed:
              sys.exit(1)
          PY

      - name: Check VBA line continuation limit
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import sys

          failed = False

          for path in Path("VBA").glob("*.bas"):
              run = 0
              run_start = 0

              for line_number, line in enumerate(
                  path.read_text(encoding="utf-8").splitlines(),
                  start=1,
              ):
                  if re.search(r"_\s*$", line):
                      if run == 0:
                          run_start = line_number
                      run += 1
                  else:
                      if run > 24:
                          print(
                              f"{path}:{run_start}: "
                              f"{run} line-continuation characters in one statement "
                              "(VBA maximum is 24)."
                          )
                          failed = True
                      run = 0

              if run > 24:
                  print(
                      f"{path}:{run_start}: "
                      f"{run} line-continuation characters in one statement "
                      "(VBA maximum is 24)."
                  )
                  failed = True

          if failed:
              sys.exit(1)
          PY

      - name: Static audit VBA declarations and compile-risk patterns
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import sys

          failed = False
          procedures = {}
          modules = {}

          proc_re = re.compile(
              r"^\s*(?:Public|Private)?\s*(Sub|Function)\s+([A-Za-z_][A-Za-z0-9_]*)",
              re.I,
          )
          dim_re = re.compile(r"^\s*Dim\s+(.+)", re.I)

          for path in Path("VBA").glob("*.bas"):
              text = path.read_text(encoding="ascii")
              lines = text.splitlines()
              modules[path] = lines

              if not any(re.match(r"^\s*Option\s+Explicit\s*$", line, re.I) for line in lines):
                  print(f"{path}: Option Explicit is missing")
                  failed = True

              for line_number, line in enumerate(lines, start=1):
                  if len(line) > 1023:
                      print(
                          f"{path}:{line_number}: physical line length "
                          f"{len(line)} exceeds VBA's 1023-character limit"
                      )
                      failed = True

                  match = proc_re.match(line)
                  if match:
                      name = match.group(2).lower()
                      procedures.setdefault(name, []).append(
                          (path, line_number, match.group(1).lower())
                      )

              if "DUMMY_API_KEY" in text:
                  print(f"{path}: legacy undefined identifier DUMMY_API_KEY found")
                  failed = True

          for name, locations in procedures.items():
              if len(locations) > 1:
                  locations_text = ", ".join(
                      f"{path}:{line}" for path, line, _ in locations
                  )
                  print(
                      f"Duplicate procedure name '{name}' across VBA modules: "
                      f"{locations_text}"
                  )
                  failed = True

          proc_names = set(procedures)

          for path, lines in modules.items():
              current = None
              current_kind = None

              for line_number, line in enumerate(lines, start=1):
                  match = proc_re.match(line)
                  if match:
                      current = match.group(2)
                      current_kind = match.group(1).lower()
                      continue

                  if current:
                      dim_match = dim_re.match(line)
                      if dim_match:
                          for part in dim_match.group(1).split(","):
                              local_match = re.match(
                                  r"\s*([A-Za-z_][A-Za-z0-9_]*)",
                                  part,
                              )
                              if local_match:
                                  local_name = local_match.group(1).lower()
                                  if local_name in proc_names:
                                      print(
                                          f"{path}:{line_number}: local variable "
                                          f"'{local_name}' shadows a procedure/function name "
                                          f"inside {current}"
                                      )
                                      failed = True

                      if re.match(
                          rf"^\s*End\s+{re.escape(current_kind)}\s*$",
                          line,
                          re.I,
                      ):
                          current = None
                          current_kind = None

          if failed:
              sys.exit(1)

          print("VBA static audit passed.")
          PY
