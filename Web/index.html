<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="OrcaRouter API learning sample for the browser">
  <title>OrcaRouter Web Chat Sample</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page-shell">
    <header class="hero">
      <div>
        <p class="eyebrow">ORCAROUTER API LEARNING SAMPLE</p>
        <h1>Web Chat</h1>
        <p class="lead">
          Chat / Streaming / Tool Calling を切り替えながら、質問・回答・HTTP電文を同じ画面で確認できます。
        </p>
      </div>
      <a class="docs-link" href="../docs/processing-flow.md">Common flow</a>
    </header>

    <section class="security-note" aria-label="Security warning">
      <strong>学習用:</strong>
      このブラウザ版はAPIキーをブラウザから直接送信します。実APIキーを埋め込んだ状態で公開しないでください。
      APIキーは保存されません。
    </section>

    <section class="config-card">
      <div class="field">
        <label for="apiKey">API key</label>
        <input id="apiKey" type="password" value="xxx-your-orcarouter-api-key-xxx" autocomplete="off">
      </div>
      <div class="field">
        <label for="model">Model</label>
        <input id="model" type="text" value="orcarouter/free">
      </div>
      <div class="field">
        <label for="mode">Mode</label>
        <select id="mode">
          <option value="chat">Chat</option>
          <option value="stream">Streaming (SSE)</option>
          <option value="tools">Tool Calling (calculate_sum)</option>
        </select>
      </div>
    </section>

    <section class="workspace">
      <article class="panel question-panel">
        <div class="panel-header">
          <div>
            <span class="step-label">INPUT</span>
            <h2>質問</h2>
          </div>
          <button id="sendButton" class="primary-button" type="button">送信</button>
        </div>

        <textarea
          id="question"
          rows="8"
          spellcheck="false"
          placeholder="例: TCPとUDPの違いを初心者向けに説明してください。"
        >こんにちは。OrcaRouterについて一言で説明してください。</textarea>
        <p id="statusText" class="status-text" aria-live="polite">Ready</p>
      </article>

      <article class="panel answer-panel">
        <div class="panel-header">
          <div>
            <span class="step-label">OUTPUT</span>
            <h2>回答</h2>
          </div>
        </div>
        <div id="answer" class="answer-box" aria-live="polite">ここに回答が表示されます。</div>
      </article>
    </section>

    <section class="panel trace-panel">
      <div class="panel-header">
        <div>
          <span class="step-label">TRACE</span>
          <h2>処理ステップ / HTTPトレース</h2>
        </div>
        <button id="clearTraceButton" class="secondary-button" type="button">クリア</button>
      </div>
      <div id="trace" class="trace-list" aria-live="polite"></div>
    </section>
  </main>

  <template id="traceItemTemplate">
    <article class="trace-item">
      <div class="trace-meta">
        <span class="trace-step"></span>
        <span class="trace-direction"></span>
        <time class="trace-time"></time>
      </div>
      <h3 class="trace-title"></h3>
      <pre class="trace-data"></pre>
    </article>
  </template>

  <script src="app.js"></script>
</body>
</html>
